name: Bug report
description: Report a reproducible problem without publishing private user content.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not upload private Discord images, prompts, tokens, `.env` files, diagnostic payloads, or server identifiers. Use a synthetic or redacted reproduction.
  - type: input
    id: version
    attributes:
      label: KREA2 version
      placeholder: 0.13.14
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Exact requested/completed model ID
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Local GPU
        - Vast Online API
        - Legacy Ollama hybrid
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or redacted content only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and exact error
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed images, prompts, usernames, URLs, local paths, tokens, and diagnostic payloads.
          required: true
