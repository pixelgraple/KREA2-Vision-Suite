name: Publish Vast worker image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - vast-serverless-gemma26/Dockerfile
      - vast-serverless-gemma26/worker.py
      - vast-serverless-gemma26/start-worker.sh
      - vast-serverless-gemma26/requirements.txt
      - vast-serverless-gemma26/.dockerignore
      - .github/workflows/publish-vast-worker.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/krea2-vision-suite-gemma26-worker
          tags: |
            type=sha
            type=raw,value=gemma4-26b-a4b-q3-kl
      - uses: docker/build-push-action@v6
        with:
          context: vast-serverless-gemma26
          file: vast-serverless-gemma26/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
