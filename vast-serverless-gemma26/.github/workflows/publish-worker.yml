name: Publish Vast worker image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - worker.py
      - start-worker.sh
      - requirements.txt
      - .dockerignore
      - .github/workflows/publish-worker.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish pinned worker
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build \
            --platform linux/amd64 \
            --tag "$image:gemma4-26b-a4b-q3-kl" \
            --tag "$image:${GITHUB_SHA}" \
            --push \
            .
