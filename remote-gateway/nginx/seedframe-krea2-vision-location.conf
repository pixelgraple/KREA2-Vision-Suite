# Insert this exact location above the general /api/ proxy in seedframe.xyz.
# It stays HTTPS-only at the existing public edge and talks to a loopback worker.
location ^~ /api/krea2-vision/ {
    proxy_pass http://127.0.0.1:3097/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 15s;
    proxy_send_timeout 1250s;
    proxy_read_timeout 1250s;
    client_max_body_size 14m;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}
