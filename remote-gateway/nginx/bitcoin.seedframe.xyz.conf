# Dedicated public hostname for KREA2 Bitcoin checkout.
# Keep bitcoin.zoo-chat.org active during migration; this file does not alter it.
server {
    listen 80;
    listen [::]:80;
    server_name bitcoin.seedframe.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /data/btcpay/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bitcoin.seedframe.xyz;

    ssl_certificate /etc/letsencrypt/live/bitcoin.seedframe.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bitcoin.seedframe.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    access_log /www/wwwlogs/bitcoin.seedframe.xyz.log;
    error_log /www/wwwlogs/bitcoin.seedframe.xyz.error.log;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:23000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
